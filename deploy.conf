# ─────────────────────────────────────────────────────────────────
#  Configuración de despliegue de ESTE tablero. Lo lee deploy.sh.
# ─────────────────────────────────────────────────────────────────

# Nombre del proyecto/carpeta (define imagen y contenedor, en minúsculas).
APP_NAME=BI_CDS_NIVELACION_MP_ME

# Subpath público → https://app.administracionsuper.com:8443/<BASE_PATH>/
# Siempre anidado bajo /BI.
BASE_PATH=BI/NivelacionMPME

# Puerto del host mapeado al 8501 del contenedor.
# Verificado en el servidor: 8501..8513 en uso; siguiente puerto libre: 8514.
HOST_PORT=8514

# Límite de memoria del contenedor (docker run --memory). OBLIGATORIO para
# proteger al host compartido ante cualquier pico de memoria.
MEM_LIMIT=512m

# PERMISO_ID del gate de autenticacion (MS_BI). No lo lee deploy.sh: va en el mapa
# /opt/config/MS_BI/permisos.json del servidor, que decide si la ruta responde o da 403.
# Se deja aqui para que el repo diga con que permiso quedo publicado. Asignado 2026-10-19.
PERMISO_ID=262
